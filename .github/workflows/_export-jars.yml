name: export-emulator-jars
on: push
permissions:
  contents: write
  checks: write
jobs:
  export:
    runs-on: ubuntu-latest
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - name: Download the official emulator jars
        run: |
          npm i -g firebase-tools@15 >/dev/null 2>&1
          firebase setup:emulators:firestore
          firebase setup:emulators:storage
          ls -la ~/.cache/firebase/emulators/
      - name: Split into blobs and publish a manifest
        run: |
          cd ~/.cache/firebase/emulators
          : > /tmp/manifest.txt
          for f in *.jar; do
            rm -rf /tmp/chunks; mkdir -p /tmp/chunks
            split -b 6000000 "$f" /tmp/chunks/part_
            line="FILE $f $(stat -c%s "$f") $(sha256sum "$f" | cut -d' ' -f1)"
            for c in /tmp/chunks/part_*; do
              base64 -w0 "$c" > /tmp/c.b64
              sha=$(jq -n --rawfile c /tmp/c.b64 '{content:$c,encoding:"base64"}' \
                    | gh api --input - /repos/${{ github.repository }}/git/blobs --jq .sha)
              line="$line $sha"
            done
            echo "$line" >> /tmp/manifest.txt
          done
          cat /tmp/manifest.txt
          jq -n --arg sha "${{ github.sha }}" --rawfile t /tmp/manifest.txt \
            '{name:"jars-manifest",head_sha:$sha,status:"completed",conclusion:"success",output:{title:"jars",summary:"chunk blob shas",text:$t}}' \
            | gh api --input - /repos/${{ github.repository }}/check-runs --jq .id
