/* ------------------------------------------------------------
   trainings (Phase 7)
   ------------------------------------------------------------ */

function saveTrainingToFirestore(draft){
  const svc = FS();
  if(!firestoreOn()) return Promise.reject(new Error('firestore-not-ready'));
  if(!authIsAdmin()) return Promise.reject(new Error('not-admin'));

  const isNew = !!draft.isNew;
  const id = isNew ? ('t_' + Date.now().toString(36)) : draft.id;

  const questions = (draft.questions || []).map(function(q){
    return {
      id: q.id || uid('q'),
      text: String(q.text || '').trim(),
      options: (q.options || []).map(function(o){ return String(o || '').trim(); }),
      marks: Number(q.marks) || 1
    };
  });
  const answerKey = {};
  (draft.questions || []).forEach(function(q){ answerKey[q.id] = Number(q.correct) || 0; });

  const feedback = deepCopy(draft.feedback || { day:'', sessions:[], questions:[] });
  feedback.questions = (feedback.questions || []).map(function(q){
    return {
      id: q.id || uid('f'),
      text: String(q.text || '').trim(),
      type: q.type === 'textarea' ? 'textarea' : 'radio',
      options: q.type === 'textarea' ? [] : (q.options || []).map(function(o){ return String(o || '').trim(); }).filter(Boolean)
    };
  });

  const doc = trainingToDoc({
    title: String(draft.title || '').trim(),
    topic: String(draft.topic || '').trim(),
    date: String(draft.date || '').trim(),
    description: String(draft.description || '').trim(),
    category: String(draft.category || '').trim(),
    accent: draft.accent || '#1D3557',
    institute: draft.institute || INSTITUTE,
    passing: Number(draft.passing) || 70,
    published: draft.published !== false,
    archived: !!draft.archived,
    questions: questions,
    answerKey: answerKey,
    feedback: feedback
  }, {
    createdAt: isNew ? svc.serverTimestamp() : (draft.createdAt || svc.serverTimestamp()),
    updatedAt: svc.serverTimestamp(),
    updatedBy: svc.email || ''
  });

  /* The questions themselves stay on the training document (students need
     to read them); only the correct-answer indices move to trainingKeys. */
  return svc.setDoc(svc.doc('trainings/' + id), doc, { merge: true }).then(function(){
    /* The key goes to the admin-only registry, and only there. The rules
       refuse a training document that carries an answerKey field at all. */
    return saveTrainingKeyDoc(id, answerKey, questions);
  }).then(function(){
    return { id: id, isNew: isNew };
  });
}

function deleteTrainingFromFirestore(id){
  const svc = FS();
  if(!firestoreOn() || !authIsAdmin()) return Promise.reject(new Error('not-admin'));
  /* the key is a separate document now, so delete it alongside the training */
  return Promise.all([
    svc.deleteDoc(svc.doc('trainings/' + id)),
    svc.deleteDoc(svc.doc('trainingKeys/' + id)).catch(function(){ /* may not exist */ })
  ]).then(function(){
    delete ANSWERS.keys[id];
  });
}

function setTrainingPublished(id, patch){
  const svc = FS();
  if(!firestoreOn() || !authIsAdmin()) return Promise.reject(new Error('not-admin'));
  return svc.updateDoc(svc.doc('trainings/' + id),
    Object.assign({}, patch, { updatedAt: svc.serverTimestamp(), updatedBy: svc.email || '' }));
}

/* ------------------------------------------------------------
   submissions (Phase 8)
   ------------------------------------------------------------ */

/* Progress of the attempt — the browser may read this but the
   final marks come from computeResult() on the stored answer key. */
function hasSubmittedOnServer(trainingId){
  const svc = FS();
  if(!svc || !svc.uid) return false;
  return DB.submissions.some(function(s){
    return s.trainingId === trainingId && s.userId === svc.uid;
  });
}

/* ------------------------------------------------------------
   Handing in a paper, in two steps.

   Step 1 writes the answers and NOTHING about the score — the rules refuse
   a submission that carries marks. The document id is fixed to
   <uid>_<trainingId>, which is what makes a second attempt impossible and
   what lets the trainingKeys rule find this submission.

   Step 2 (scoreSubmissionInFirestore, below) fills the score in. By then
   the answers are frozen, and the rules recompute the marks from them.
   ------------------------------------------------------------ */
function submissionIdFor(trainingId){
  const svc = FS();
  return (svc && svc.uid ? svc.uid : 'anon') + '_' + trainingId;
}

function submitAssessmentToFirestore(training, answers, feedback, details){
  const svc = FS();
  if(!firestoreOn()) return Promise.reject(new Error('firestore-not-ready'));
  if(!authIsApproved()) return Promise.reject(new Error('not-approved'));

  const u = currentUser() || {};
  const id = submissionIdFor(training.id);

  const doc = {
    studentUid: svc.uid,
    trainingId: training.id,
    officialNameSnapshot: details.name || u.name || '',
    kgidSnapshot: details.kgid || u.kgid || '',
    emailSnapshot: details.email || u.email || '',
    designationSnapshot: u.designation || '',
    trainingTitle: training.title || '',
    trainingTopic: training.topic || '',
    trainingDate: training.date || '',
    feedbackResponses: deepCopy(feedback || { ratings:{}, answers:{} }),
    assessmentAnswers: deepCopy(answers || {}),
    /* the same answers, flattened one token per mark, for the rules */
    answerTokens: answerTokensFor(training, answers),
    attemptNo: 1,
    certificateNo: null,
    submittedAt: svc.serverTimestamp()
  };

  /* Write first. Only if that is refused do we look, because a submission
     that does not exist cannot be read — the read rule tests
     resource.data.studentUid, and there is no resource. Writing first also
     costs one round trip instead of two on the normal path. */
  return svc.setDoc(svc.doc('submissions/' + id), doc)
    .then(function(){ return { id: id }; })
    .catch(function(err){
      if(!err || err.code !== 'permission-denied') throw err;
      /* the usual reason is that this paper is already in: a reload, a
         second tab, or a submit that died before the marks were written */
      return svc.getDoc(svc.doc('submissions/' + id)).then(function(snap){
        if(snap && snap.exists && snap.exists()){
          const prev = snap.data() || {};
          return { id: id, resumed: true, alreadyScored: prev.marksObtained !== undefined };
        }
        throw err;
      }, function(){ throw err; });
    });
}

/* The key for one training. The rules hand it over only once the submission
   above exists, so this call fails while the paper is still open — which is
   exactly the point. */
function fetchAnswerKeyForTraining(trainingId){
  const svc = FS();
  if(!firestoreOn()) return Promise.resolve({});
  return svc.getDoc(svc.doc('trainingKeys/' + trainingId)).then(function(snap){
    const d = (snap && snap.exists && snap.exists()) ? (snap.data() || {}) : {};
    const key = d.key || {};
    ANSWERS.keys[trainingId] = key;
    return key;
  });
}

/* Write the score back. Every number here is re-derived by the rules from
   the frozen answers; a value the key does not support is refused. */
function scoreSubmissionInFirestore(submissionId, result){
  const svc = FS();
  if(!firestoreOn()) return Promise.resolve(false);
  return svc.updateDoc(svc.doc('submissions/' + submissionId), {
    marksObtained: result.marks,
    totalMarks: result.total,
    percentage: result.pct,
    passStatus: !!result.passed,
    correctCount: result.correct,
    wrongCount: result.wrong,
    passingPercent: result.passing,
    scoredAt: svc.serverTimestamp()
  }).then(function(){ return true; });
}

function authIsApproved(){
  if(authIsAdmin()) return true;
  return !!(AUTH.profile && AUTH.profile.status === 'approved');
}

/* ------------------------------------------------------------
   certificate register + serial numbers
   ------------------------------------------------------------ */

/* Certificate numbers.

   There used to be two schemes: the admin got a serial from a counter
   (DTI-BNG-2026-0007) while a student got a random per-uid token
   (DTI-BNG-2026-S1J9NFU). Both looked official and neither was
   reconcilable with the other, so the register could not be audited.

   ISSUED SERIAL      DTI-BNG-<year>-<NNNN>
     One source: the settings/portal counter, bumped in a transaction.
     Only the admin can write settings/, so only the admin can mint one.

   PROVISIONAL NUMBER DTI-BNG-<year>-PROV-<uid token>-<NN>
     A student cannot reach the counter, so when the browser issues the
     certificate it cannot be given a serial. It gets this instead.

     The provisional form used to be 9000 + a counter kept in this
     browser's localStorage, formatted exactly like a serial. Two
     problems, both reproduced against the emulator in
     tests/emulator/suites/09-cert-numbering.js:
       - the counter is per device, so EVERY student's first certificate
         was DTI-BNG-<year>-9001 (N04); and
       - once settings/portal.certCounter passes 9000 the admin mints
         DTI-BNG-<year>-9001 as a real serial and the two collide (N05).

     The uid token makes it unique per student, and the PROV marker means
     it can never equal a counter serial and can never be mistaken for one
     by a human reading the certificate. The certificate document also
     carries provisional: true so the admin register can find them. */
function formatCertNumber(year, n){
  return 'DTI-BNG-' + year + '-' + String(n).padStart(4, '0');
}

/* A short, stable, per-account token. Same account -> same token, so a
   student's numbers stay recognisably theirs. */
function certUidToken(uid){
  const src = String(uid || 'anon');
  let hashed = 0;
  for(let i = 0; i < src.length; i++){
    hashed = ((hashed << 5) - hashed + src.charCodeAt(i)) | 0;
  }
  return Math.abs(hashed).toString(36).toUpperCase().padStart(5, '0').slice(0, 5);
}

function formatProvisionalCertNumber(year, uid, seq){
  return 'DTI-BNG-' + year + '-PROV-' + certUidToken(uid) + '-' + String(seq).padStart(2, '0');
}

/* Is this number a provisional one rather than a register serial? */
function isProvisionalCertNumber(no){
  return /-PROV-/.test(String(no || ''));
}

function nextCertificateNumberRemote(){
  const svc = FS();
  const year = new Date().getFullYear();
  const myUid = (svc && svc.uid) || (currentUser() || {}).id || 'anon';

  if(!firestoreOn() || !svc){
    return Promise.resolve(formatProvisionalCertNumber(year, myUid, nextLocalCertSeq()));
  }

  /* settings/ is admin-write-only. A student cannot run this transaction at
     all, so do not even attempt it: attempt it and the whole submit flow
     fails with permission-denied. They get a provisional number instead. */
  if(!authIsAdmin()){
    return Promise.resolve(formatProvisionalCertNumber(year, myUid, nextLocalCertSeq()));
  }

  return svc.runTransaction(function(tx){
    const ref = svc.doc('settings/portal');
    return tx.get(ref).then(function(snap){
      const cur = snap.exists() ? (snap.data() || {}) : {};
      const n = (Number(cur.certCounter) || 0) + 1;
      tx.set(ref, { certCounter: n, updatedAt: svc.serverTimestamp() }, { merge: true });
      return formatCertNumber(year, n);
    });
  }).catch(function(err){
    /* the counter is unreachable (offline, or the rules refused the write).
       Do not invent a serial that looks real: mark it provisional so the
       admin can renumber it, and say so in the console. */
    console.warn('[cert] counter unavailable, issuing a provisional number', err && err.code);
    return formatProvisionalCertNumber(year, myUid, nextLocalCertSeq());
  });
}

/* Per-device attempt counter. It only distinguishes one student's own
   provisional numbers from each other; uniqueness between students comes
   from the uid token in formatProvisionalCertNumber(). */
function nextLocalCertSeq(){
  DB.certCounter = (Number(DB.certCounter) || 0) + 1;
  return DB.certCounter;
}

function attachCertificateNumber(submissionId, certNo){
  /* submissions/{id} is an audit record: "allow update: if false" refuses
     this write for EVERYONE, the admin included (verified against the
     emulator, 04-submissions.js S17-S20). The old code sent it anyway and
     swallowed the permission-denied, which cost a round trip on every
     single submission and logged a denial server-side. The certificate
     register is the source of truth for the number; keep the local copy
     in step so the result screen can show it. */
  try{
    const local = DB.submissions.find(function(s){ return s.id === submissionId; });
    if(local) local.certificateNo = certNo;
  }catch(e){}
  return Promise.resolve();
}

function saveCertificateToFirestore(sub, certNo){
  const svc = FS();
  if(!firestoreOn()) return Promise.resolve();
  const id = 'cert_' + sub.id;
  const doc = {
    number: certNo,
    /* A number the browser minted because the student cannot reach the
       settings/portal counter. The admin register shows these separately
       so they can be re-issued with a real serial. */
    provisional: isProvisionalCertNumber(certNo),
    submissionId: sub.id,
    studentUid: sub.userId,
    studentName: sub.details.name,
    kgid: sub.details.kgid || '',
    trainingId: sub.trainingId,
    trainingTitle: sub.trainingTitle,
    trainingTopic: sub.trainingTopic,
    date: sub.trainingDate,
    marks: sub.result.marks,
    total: sub.result.total,
    pct: sub.result.pct,
    issuedAt: svc.serverTimestamp()
  };
  return svc.setDoc(svc.doc('certificates/' + id), doc).catch(function(err){
    console.warn('[cert] register write failed', err && err.code);
  });
}

function loadCertDesignRemote(){

function saveCertDesignRemote(design, bgUrl){

    fields: (design.fields || []).map(function(f){

/* Seed the built-in Kannada training once, for an empty register.
   Re-running is safe: the check and the write both key off the fixed
   t_assembly document id, so a repeated init cannot create a duplicate. */
let SEEDING = { running:false, done:false };

function publishDefaultTrainingIfEmpty(){
  const svc = FS();
  if(!firestoreOn() || !authIsAdmin()) return Promise.resolve(false);
  if(SEEDING.running) return Promise.resolve(false);
  SEEDING.running = true;

  return svc.getDocs(svc.collection('trainings')).then(function(snap){
    const existing = [];
    if(snap && typeof snap.forEach === 'function'){
      snap.forEach(function(d){ existing.push(d.id); });
    }
    const t = defaultTraining();
    /* already seeded by a previous run (even if other trainings were deleted)? */
    if(existing.indexOf(t.id) !== -1){ SEEDING.done = true; return false; }
    /* a populated register is the admin's own content — never add to it */
    if(existing.length > 0){ SEEDING.done = true; return false; }

    return svc.setDoc(svc.doc('trainings/' + t.id), trainingToDoc(t, {
      createdAt: svc.serverTimestamp(),
      updatedAt: svc.serverTimestamp(),
      updatedBy: svc.email || ''
    })).then(function(){
      /* the seed carries its own key; keep the registry in step */
      return saveTrainingKeyDoc(t.id, t.answerKey || {}, t.questions, t.passing).catch(function(){ return null; });
    }).then(function(){
      SEEDING.done = true;
      return true;
    });
  }).catch(function(err){
    logFirestoreError('seed training', err);
    return false;
  }).then(function(res){
    SEEDING.running = false;
    return res;
  });
}

  renderSetupBanner();
  /* Firebase account gate decides which top-level screen shows.
     'ready' falls through to the original routing below. */
  const gate = AUTH.gate;
  if(gate !== 'ready'){
    appEl.innerHTML = viewGate();
    bindPostRender();
    return;
  }

  const u = currentUser();

  if(!u){
    appEl.innerHTML = viewLogin();
    bindPostRender();
    return;
  }
  if(u.role === 'admin'){
    appEl.innerHTML = viewAdminShell(u);
    bindPostRender();
    return;
  }
  /* student */
  if(state.route === 'workflow' && state.trainingId && getTraining(state.trainingId)){
    appEl.innerHTML = viewWorkflowShell(u);
  }else{
    state.route = 'dashboard';
    appEl.innerHTML = viewStudentShell(u);
  }
  bindPostRender();
}

/* Bind data-bind inputs for admin editor + misc after every render */
function bindPostRender(){
  $$('[data-bind]').forEach(el => {
    const handler = () => {
      if(!state.editing) return;
      let v = el.value;
      const p = el.dataset.bind;
      if(/(\.|^)(correct|passing|marks)$/.test(p)) v = Number(v) || 0;
      setPath(state.editing, p, v);
    };
    el.addEventListener('input', handler);
    el.addEventListener('change', handler);
  });

  $$('[data-det]').forEach(el => {
    el.addEventListener('input', () => {
      if(!state.draft) return;
      state.draft.details[el.dataset.det] = el.value;
      persistDraft();
    });
  });

  $$('[data-fb]').forEach(el => {
    el.addEventListener('input', () => {
      if(!state.draft) return;
      state.draft.feedback.answers[el.dataset.fb] = el.value;
      persistDraft();
    });
  });

  $$('input[name^="rate_"]').forEach(el => {
    el.addEventListener('change', () => {
      if(!state.draft) return;
      if(!state.draft.feedback) state.draft.feedback = { ratings:{}, answers:{} };
      if(!state.draft.feedback.ratings) state.draft.feedback.ratings = {};
      state.draft.feedback.ratings[el.name.slice(5)] = el.value;
      persistDraft();
    });
  });

  $$('input[name^="ans_"]').forEach(el => {
    el.addEventListener('change', () => {
      if(!state.draft) return;
      state.draft.answers[el.name.slice(4)] = Number(el.value);
      persistDraft();
    });
  });

  /* filter inputs for results table (live DOM filtering) */
  $$('[data-filter]').forEach(el => {
    el.addEventListener('input', applyResultFilter);
    el.addEventListener('change', applyResultFilter);
  });

  /* certificate designer property inputs */
  if(state.adminSection === 'certdesigner' && certDesState.design){
    bindCertDesInputs();
  }

  /* student account search / status filters */
  if(state.adminSection === 'accounts'){
    bindAccountFilters();
  }

  /* backup file picker */
  const bfi = document.getElementById('backupFileInput');
  if(bfi && !bfi.__bound){
    bfi.__bound = true;
    bfi.addEventListener('change', function(e){
      const f = e.target.files && e.target.files[0];
      handleBackupFile(f);
      e.target.value = '';
    });
  }
}

/* ============================================================
   SECTION H — TRAINING WORKFLOW
   ============================================================ */
const STAGES = [
  { n:1, label:'ಭಾಗವಹಿಸುವವರ ವಿವರಗಳು' },
  { n:2, label:'ತರಬೇತಿ ಪ್ರತಿಕ್ರಿಯೆ' },
  { n:3, label:'ಮೌಲ್ಯಮಾಪನ' },
  { n:4, label:'ಫಲಿತಾಂಶ' },
  { n:5, label:'ಪ್ರಮಾಣಪತ್ರ' }
];

function openTraining(id){
  const u = currentUser();
  if(!u) return;
  const t = getTraining(id);
  if(!t){ toast('ತರಬೇತಿ ಕಾರ್ಯಕ್ರಮ ಕಂಡುಬಂದಿಲ್ಲ.','error'); return; }

  state.trainingId = id;
  const sub = getSubmission(u.id, id);

  if(sub){
    state.stage = 4;
    state.draft = newDraft(u);
    state.route = 'workflow';
    render();
    return;
  }

  const d = readDraft();
  state.draft = d || newDraft(u);
  if(!state.draft.details) state.draft.details = { email:'', name:u.name, kgid:'' };
  if(!state.draft.details.name) state.draft.details.name = u.name;
  if(!state.draft.feedback) state.draft.feedback = { ratings:{}, answers:{} };
  if(!state.draft.answers) state.draft.answers = {};

  state.stage = Math.min(Math.max(Number(state.draft.stage) || 1, 1), 3);
  state.route = 'workflow';
  render();
}

function stageAccessible(n){
  const u = currentUser();
  const t = getTraining(state.trainingId);
  if(!u || !t) return false;
  const sub = getSubmission(u.id, t.id);

  if(n === 1) return true;
  if(n === 2) return isDetailsComplete();
  if(n === 3) return isDetailsComplete() && isFeedbackComplete(t);
  if(n === 4) return !!sub;
  if(n === 5) return !!(sub && sub.result.passed);
  return false;
}

function isDetailsComplete(){
  const d = state.draft && state.draft.details;
  if(!d) return false;
  return !!(String(d.email||'').trim() && isEmail(d.email) &&
            String(d.name||'').trim() && String(d.kgid||'').trim());
}
function isFeedbackComplete(t){
  if(!state.draft || !t) return false;
  const fb = state.draft.feedback || {};
  const sessions = (t.feedback && t.feedback.sessions) || [];
  for(let i=0;i<sessions.length;i++){
    if(!fb.ratings || !fb.ratings[String(i)]) return false;
  }
  const qs = (t.feedback && t.feedback.questions) || [];
  for(let i=0;i<qs.length;i++){
    const q = qs[i];
    const val = fb.answers ? fb.answers[q.id] : '';
    if(q.type === 'textarea'){
      if(!String(val||'').trim()) return false;
    }else if(!val){
      return false;
    }
  }
  return true;
}

function viewWorkflowShell(u){
  const t = getTraining(state.trainingId);
  if(!t){
    return '<div class="app-shell"><div class="main-col">' +
      topbar('ತರಬೇತಿ', INSTITUTE, u) +
      '<main class="main"><div class="card center">ತರಬೇತಿ ಕಾರ್ಯಕ್ರಮ ಲಭ್ಯವಿಲ್ಲ. <button class="btn btn-primary btn-sm" data-action="student-nav" data-to="dashboard">ಮರಳಿ</button></div></main></div></div>';
  }
  const sub = getSubmission(u.id, t.id);

  const stepsHtml = STAGES.map(s => {
    const accessible = stageAccessible(s.n);
    const cls = 'step' + (state.stage === s.n ? ' active' : '') +
      (state.stage > s.n ? ' done' : '') + (accessible ? ' clickable' : '');
    return '<div class="' + cls + '" data-action="goto-stage" data-n="' + s.n + '">' +
      '<div class="s-dot">' + (state.stage > s.n ? '✓' : s.n) + '</div>' +
      '<div class="s-label">' + esc(s.label) + '</div>' +
    '</div>';
  }).join('');

  let content = '';
  if(state.stage === 1)      content = stageDetails(t);
  else if(state.stage === 2) content = stageFeedback(t);
  else if(state.stage === 3) content = stageAssessment(t, sub);
  else if(state.stage === 4) content = stageResult(t, sub);
  else if(state.stage === 5) content = stageCertificate(t, sub);

  return '<div class="app-shell">' +
    '<aside class="sidebar" id="sidebar">' + sidebarBrand() +
      '<nav class="sb-nav">' +
        '<div class="sb-label">ತರಬೇತಿ</div>' +
        '<button class="nav-item" data-action="student-nav" data-to="dashboard">' + ICON.dashboard + '<span>ಡ್ಯಾಶ್‌ಬೋರ್ಡ್</span></button>' +
        '<button class="nav-item active" data-action="open-training" data-id="' + esc(t.id) + '">' + ICON.book + '<span>ಪ್ರಸ್ತುತ ತರಬೇತಿ</span></button>' +
        '<button class="nav-item" data-action="student-nav" data-to="result">' + ICON.results + '<span>ಫಲಿತಾಂಶ</span></button>' +
        '<button class="nav-item" data-action="student-nav" data-to="certificate">' + ICON.cert + '<span>ಪ್ರಮಾಣಪತ್ರ</span></button>' +
      '</nav>' +
      sidebarUserCard(u) +
    '</aside>' +
    '<div class="sidebar-overlay" id="sidebarOverlay" data-action="close-sidebar"></div>' +
    '<div class="main-col">' +
      topbar(trunc(t.title, 46), 'ದಿನಾಂಕ: ' + t.date, u) +
      '<main class="main">' +
        '<div class="page-head">' +
          '<h2>' + esc(t.title) + '</h2>' +
          '<div class="ph-sub">' + esc(t.topic) + '</div>' +
        '</div>' +
        '<div class="steps">' + stepsHtml + '</div>' +
        content +
      '</main>' +
    '</div>' +
  '</div>';
}

  const d = state.draft.details || {};
  return '<div class="card">' +
    '<div class="card-head">' +

/* ============================================================
   SECTION I — ASSESSMENT SCORING & SUBMISSION
   ============================================================ */
/* `key` is the answer key fetched from trainingKeys/{id} after the paper was
   handed in. It is passed explicitly because the training document no longer
   carries one — training.answerKey only exists in the offline demo DB and on
   the admin's screens. */
function computeResult(training, answers, key){
  const qs = (training && Array.isArray(training.questions)) ? training.questions : [];
  const ans = answers || {};
  const sheet = key || (training && training.answerKey) || {};
  let correct = 0;
  let earned = 0;          /* marks actually awarded, weighted per question */
  let totalMarks = 0;      /* the most that could be earned */

  qs.forEach(function(q){
    /* Each question carries its own weight. It defaulted to 1 before, so a
       paper of equal-weight questions scores exactly as it always did. */
    const weight = Number(q.marks) > 0 ? Number(q.marks) : 1;
    totalMarks += weight;

    const expected = sheet[q.id];
    const given = ans[q.id];
    const answered = given !== undefined && given !== null && String(given) !== '';
    if(answered && expected !== undefined && Number(given) === Number(expected)){
      correct++;
      earned += weight;
    }
  });

  /* The pass mark stays a percentage of the total available marks, so
     changing a question's weight never silently moves the pass threshold. */
  const pct = totalMarks ? Math.round((earned / totalMarks) * 100) : 0;
  const passing = Number(training.passing) || 70;

  return {
    correct: correct,
    wrong: qs.length - correct,
    total: totalMarks,        /* total marks available */
    totalQuestions: qs.length,
    marks: earned,            /* marks obtained */
    pct: pct,
    passed: pct >= passing,
    passing: passing
  };
}

/* Offline / unconfigured: there is no counter to read, so this is a
   provisional number too. It used to mint DTI-BNG-<year>-0001, which is
   the same shape as a real serial and collides with the register the
   first time the admin issues one. */
function nextCertificateNumber(){
  const svc = FS();
  const myUid = (svc && svc.uid) || (currentUser() || {}).id || 'anon';
  return formatProvisionalCertNumber(new Date().getFullYear(), myUid, nextLocalCertSeq());
}

function submitAssessment(){
  const u = currentUser();
  const t = getTraining(state.trainingId);
  if(!u || !t) return;

  /* duplicate guard */
  if(getSubmission(u.id, t.id)){
    toast('ನೀವು ಈಗಾಗಲೇ ಈ ಪರೀಕ್ಷೆಯನ್ನು ಸಲ್ಲಿಸಿದ್ದೀರಿ.','error');
    state.stage = 4; render(); return;
  }

  const answers = state.draft.answers || {};
  const missing = t.questions.filter(q => answers[q.id] === undefined || answers[q.id] === null || answers[q.id] === '');
  if(missing.length){
    showStageMsg('ಎಲ್ಲಾ ಪ್ರಶ್ನೆಗಳಿಗೆ ಉತ್ತರಿಸಿ. ಬಾಕಿ ಇರುವ ಪ್ರಶ್ನೆಗಳು: ' + missing.length, 'error');
    toast('ದಯವಿಟ್ಟು ಎಲ್ಲಾ ' + t.questions.length + ' ಪ್ರಶ್ನೆಗಳಿಗೆ ಉತ್ತರಿಸಿ.','error');
    return;
  }

  const details = state.draft.details || {};

  /* The browser cannot mark this paper yet: the answer key is unreadable
     until the submission exists. `result` is filled in after the hand-in,
     from the key the rules then release. */
  let result = null;

  const submission = {
    id: uid('sub'),
    userId: u.id,
    userName: u.name,
    trainingId: t.id,
    trainingTitle: t.title,
    trainingTopic: t.topic,
    trainingDate: t.date,
    details: {
      name: details.name || u.name,
      email: details.email || '',
      kgid: details.kgid || ''
    },
    feedback: deepCopy(state.draft.feedback || { ratings:{}, answers:{} }),
    answers: deepCopy(answers),
    result: null,
    submittedAt: nowISO(),
    certificateNo: null
  };

  /* ---- write to Firestore, then reflect it locally ---- */
  const finish = function(certNo){
    submission.result = result;
    if(certNo){
      submission.certificateNo = certNo;
      DB.certificates.push({
        id: 'cert_' + submission.id,
        number: certNo,
        submissionId: submission.id,
        userId: u.id,
        studentName: submission.details.name,
        trainingId: t.id,
        trainingTitle: t.title,
        trainingTopic: t.topic,
        date: t.date,
        marks: result.marks,
        total: result.total,
        pct: result.pct,
        issuedAt: nowISO()
      });
    }
    DB.submissions.push(submission);
    saveDB();
    dropDraft();
    state.stage = 4;
    render();
    toast(result.passed
      ? 'ಪರೀಕ್ಷೆ ಯಶಸ್ವಿಯಾಗಿ ಸಲ್ಲಿಸಲಾಗಿದೆ. ಅಭಿನಂದನೆಗಳು!'
      : 'ಪರೀಕ್ಷೆ ಸಲ್ಲಿಸಲಾಗಿದೆ.', result.passed ? 'success' : 'info');
  };

  if(!firestoreOn()){
    /* offline / not configured: the demo DB holds its own key, so the old
       local behaviour is unchanged */
    result = computeResult(t, answers);
    const localCert = result.passed ? nextCertificateNumber() : null;
    finish(localCert);
    return;
  }

  showStageMsg('ಸಲ್ಲಿಸಲಾಗುತ್ತಿದೆ…', 'ok');
  /* hand in -> read the key the rules now release -> mark -> write the
     score back (the rules re-mark it) -> certificate */
  submitAssessmentToFirestore(t, answers, state.draft.feedback, details)
    .then(function(res){
      submission.id = res.id;
      return fetchAnswerKeyForTraining(t.id).then(function(key){
        result = computeResult(t, answers, key);
        /* a paper that was already marked (a resumed or duplicate submit)
           must not be marked again — the rules refuse it, and rightly */
        if(res.alreadyScored) return null;
        return scoreSubmissionInFirestore(res.id, result);
      }).then(function(){
        if(!result.passed) return null;
        return nextCertificateNumberRemote().then(function(certNo){
          return saveCertificateToFirestore(submission, certNo)
            .then(function(){ return attachCertificateNumber(res.id, certNo); })
            .then(function(){ return certNo; });
        });
      });
    })
    .then(finish)
    .catch(function(err){
      const code = (err && err.code) || (err && err.message) || '';
      console.warn('[submit] failed', code);
      let msg = 'ಸಲ್ಲಿಸಲು ಸಾಧ್ಯವಾಗಲಿಲ್ಲ. ಮತ್ತೆ ಪ್ರಯತ್ನಿಸಿ.';
      if(code === 'permission-denied'){
        msg = 'ಸಲ್ಲಿಸಲು ಅನುಮತಿ ಇಲ್ಲ. ನಿಮ್ಮ ಖಾತೆ ಅನುಮೋದಿತವಾಗಿದೆಯೇ ಎಂದು ಪರಿಶೀಲಿಸಿ.';
      }else if(code === 'not-approved'){
        msg = 'ನಿಮ್ಮ ಖಾತೆ ಇನ್ನೂ ಅನುಮೋದಿತವಾಗಿಲ್ಲ.';
      }else if(code === 'firestore-not-ready'){
        msg = 'ಡೇಟಾಬೇಸ್ ಸಂಪರ್ಕವಿಲ್ಲ.';
      }
      showStageMsg(msg, 'error');
      toast(msg, 'error');
    });
}

function showStageMsg(text, type){
  const el = document.getElementById('stageMsg');
  if(!el) return;
  el.className = 'form-msg show ' + (type || 'error');
  el.textContent = text;
}

/* ---------- Training save ---------- */
function saveTraining(){
  const d = state.editing;
  if(!d) return;

  const errors = [];
  if(!String(d.title||'').trim()) errors.push('ತರಬೇತಿ ಶೀರ್ಷಿಕೆ ಅಗತ್ಯ.');
  if(!String(d.topic||'').trim()) errors.push('ತರಬೇತಿ ವಿಷಯ ಅಗತ್ಯ.');
  if(!String(d.date||'').trim()) errors.push('ದಿನಾಂಕ ಅಗತ್ಯ.');

  const passing = Number(d.passing);
  if(!passing || passing < 1 || passing > 100) errors.push('ಉತ್ತೀರ್ಣ ಶೇಕಡಾವಾರು 1 ಮತ್ತು 100 ರ ನಡುವೆ ಇರಬೇಕು.');

  if(!Array.isArray(d.questions) || d.questions.length === 0) errors.push('ಕನಿಷ್ಠ ಒಂದು ಮೌಲ್ಯಮಾಪನ ಪ್ರಶ್ನೆ ಅಗತ್ಯ.');

  (d.questions||[]).forEach((q, i) => {
    if(!String(q.text||'').trim()) errors.push('ಪ್ರಶ್ನೆ ' + (i+1) + ': ಪ್ರಶ್ನೆ ಪಠ್ಯ ಅಗತ್ಯ.');
    const opts = (q.options||[]).map(o => String(o||'').trim());
    if(opts.length !== 4 || opts.some(o => !o)){
      errors.push('ಪ್ರಶ್ನೆ ' + (i+1) + ': ನಾಲ್ಕು ಆಯ್ಕೆಗಳು ಅಗತ್ಯ.');
    }
    const c = Number(q.correct);
    if(isNaN(c) || c < 0 || c > 3) errors.push('ಪ್ರಶ್ನೆ ' + (i+1) + ': ಸರಿಯಾದ ಉತ್ತರವನ್ನು ಆಯ್ಕೆಮಾಡಿ.');
  });

  if(errors.length){
    const msg = document.getElementById('adminFormMsg');
    if(msg){
      msg.className = 'form-msg show error';
      msg.innerHTML = errors.map(e => '• ' + esc(e)).join('<br>');
    }
    toast('ದಯವಿಟ್ಟು ದೋಷಗಳನ್ನು ಸರಿಪಡಿಸಿ.','error');
    return;
  }

  /* split visible questions from the answer key */
  const questions = d.questions.map(q => ({
    id: q.id || uid('q'),
    text: String(q.text).trim(),
    options: q.options.map(o => String(o).trim()),
    marks: Number(q.marks) || 1
  }));
  const answerKey = {};
  d.questions.forEach(q => { answerKey[q.id] = Number(q.correct) || 0; });

  const feedback = deepCopy(d.feedback || { day:'', sessions:[], questions:[] });
  feedback.questions = (feedback.questions || []).map(q => ({
    id: q.id || uid('f'),
    text: String(q.text||'').trim(),
    type: q.type === 'textarea' ? 'textarea' : 'radio',
    options: q.type === 'textarea' ? [] : (q.options || []).map(o => String(o||'').trim()).filter(Boolean)
  }));

  if(d.isNew){
    const newT = {
      id: uid('t'),
      title: d.title.trim(),
      topic: d.topic.trim(),
      date: d.date.trim(),
      description: (d.description||'').trim(),
      category: (d.category||'').trim(),
      accent: d.accent || '#1D3557',
      institute: INSTITUTE,
      passing: passing,
      createdAt: nowISO(),
      questions: questions,
      answerKey: answerKey,
      feedback: feedback
    };
    DB.trainings.push(newT);
    toast('ಹೊಸ ತರಬೇತಿ ಯಶಸ್ವಿಯಾಗಿ ಸೇರಿಸಲಾಗಿದೆ.','success');
  }else{
    const t = getTraining(d.id);
    if(!t){ toast('ತರಬೇತಿ ಕಂಡುಬಂದಿಲ್ಲ.','error'); return; }
    t.title = d.title.trim();
    t.topic = d.topic.trim();
    t.date = d.date.trim();
    t.description = (d.description||'').trim();
    t.category = (d.category||'').trim();
    t.accent = d.accent || '#1D3557';
    t.passing = passing;
    t.questions = questions;
    t.answerKey = answerKey;
    t.feedback = feedback;
    toast('ತರಬೇತಿ ಯಶಸ್ವಿಯಾಗಿ ಸಂಪಾದಿಸಲಾಗಿದೆ.','success');
  }

  if(firestoreOn()){
    saveTrainingToFirestore(d).then(function(res){
      toast(res.isNew ? 'ಹೊಸ ತರಬೇತಿ ಸೇರಿಸಲಾಗಿದೆ.' : 'ತರಬೇತಿ ಸಂಪಾದಿಸಲಾಗಿದೆ.', 'success');
      state.editing = null;
      return reloadPortalData();
    }).catch(function(err){
      const denied = err && (err.code === 'permission-denied' || err.message === 'not-admin');
      toast(denied ? 'ಅನುಮತಿ ನಿರಾಕರಿಸಲಾಗಿದೆ.' : 'ಉಳಿಸಲು ಸಾಧ್ಯವಾಗಲಿಲ್ಲ.', 'error');
    });
    return;
  }
  saveDB();
  state.editing = null;
  render();
}

function applyResultFilter(){
  const tSel = document.getElementById('fTraining');
  const qInp = document.getElementById('fQuery');
  const cSel = document.getElementById('fCert');
  const table = document.getElementById('resultsTable');
  if(!table) return;

  const tid = tSel ? tSel.value : '';
  const q = qInp ? qInp.value.trim().toLowerCase() : '';
  const cert = cSel ? cSel.value : '';

  $$('#resultsTable tbody tr').forEach(tr => {
    const rowTraining = tr.getAttribute('data-training') || '';
    const rowCert = tr.getAttribute('data-cert') || '';
    const text = tr.textContent.toLowerCase();
    let show = true;
    if(tid && rowTraining !== tid) show = false;
    if(q && text.indexOf(q) === -1) show = false;
    if(cert && rowCert !== cert) show = false;
    tr.style.display = show ? '' : 'none';
  });
}

function exportCSV(){
  const tSel = document.getElementById('fTraining');
  const qInp = document.getElementById('fQuery');
  const cSel = document.getElementById('fCert');
  const tid = tSel ? tSel.value : '';
  const q = qInp ? qInp.value.trim().toLowerCase() : '';
  const cert = cSel ? cSel.value : '';

  let rows = DB.submissions.slice().sort((a,b) => new Date(b.submittedAt) - new Date(a.submittedAt));
  rows = rows.filter(s => {
    if(tid && s.trainingId !== tid) return false;
    if(cert === 'yes' && !s.result.passed) return false;
    if(cert === 'no' && s.result.passed) return false;
    if(q){
      const hay = ((s.details.name||'') + ' ' + (s.details.email||'') + ' ' + (s.userName||'')).toLowerCase();
      if(hay.indexOf(q) === -1) return false;
    }
    return true;
  });

  if(!rows.length){ toast('ರಫ್ತು ಮಾಡಲು ಯಾವುದೇ ದಾಖಲೆಗಳಿಲ್ಲ.','error'); return; }

  const header = ['ವಿದ್ಯಾರ್ಥಿಯ ಹೆಸರು','ಇ-ಮೇಲ್','ಕೆ.ಜಿ.ಐ.ಡಿ / HRMS','ತರಬೇತಿ','ಅಂಕಗಳು','ಒಟ್ಟು','ಶೇಕಡಾವಾರು','ಸ್ಥಿತಿ','ಪ್ರಮಾಣಪತ್ರ ಸಂಖ್ಯೆ','ಸಲ್ಲಿಸಿದ ದಿನಾಂಕ'];
  const lines = [header];
  rows.forEach(s => {
    lines.push([
      s.details.name || s.userName,
      s.details.email || '',
      s.details.kgid || '',
      s.trainingTitle,
      s.result.marks,
      s.result.total,
      s.result.pct + '%',
      s.result.passed ? 'ಉತ್ತೀರ್ಣ' : 'ಅನುತ್ತೀರ್ಣ',
      s.certificateNo || '-',
      fmtDateTime(s.submittedAt)
    ]);
  });

  const csv = '\uFEFF' + lines.map(r => r.map(c => '"' + String(c).replace(/"/g,'""') + '"').join(',')).join('\r\n');
  try{
    const blob = new Blob([csv], { type:'text/csv;charset=utf-8;' });
    const url = URL.createObjectURL(blob);
    const a = document.createElement('a');
    a.href = url;
    a.download = 'dti-bengaluru-results-' + Date.now() + '.csv';
    document.body.appendChild(a);
    a.click();
    document.body.removeChild(a);
    setTimeout(()=> URL.revokeObjectURL(url), 1500);
    toast('CSV ಫೈಲ್ ಡೌನ್‌ಲೋಡ್ ಆಗಿದೆ.','success');
  }catch(e){
    toast('CSV ರಫ್ತು ವಿಫಲವಾಯಿತು.','error');
  }
}

/* ============================================================
   SECTION K.5 — CERTIFICATE DESIGNER (custom background support)
   ============================================================ */
const CERT_DESIGN_KEY = 'dti_cert_design_v1';
const CERT_BG_KEY     = 'dti_cert_bg_v1';
const CERT_FONTS = {
  kn:    { css:"'Noto Sans Kannada',sans-serif",        label:'Kannada' },
  serif: { css:"Georgia,'Times New Roman',serif",       label:'Serif' },
  sans:  { css:"system-ui,-apple-system,'Segoe UI',sans-serif", label:'Sans' },
  mono:  { css:"ui-monospace,Menlo,Consolas,monospace", label:'Mono' }
};

let certDesState = { design:null, bg:'', selectedId:null, dragging:null };

function defaultCertDesign(){
  return { useCustom:false, aspect:1.414, fields:[] };
}
function loadCertDesign(){
  try{
    const raw = localStorage.getItem(CERT_DESIGN_KEY);
    if(raw){
      const d = JSON.parse(raw);
      if(d && Array.isArray(d.fields)) return d;
    }
  }catch(e){}
  return defaultCertDesign();
}
function saveCertDesign(design){
  try{ localStorage.setItem(CERT_DESIGN_KEY, JSON.stringify(design)); return true; }
  catch(e){ toast('Design could not be saved (storage limit).','error'); return false; }
}
function loadCertBg(){
  try{ return localStorage.getItem(CERT_BG_KEY) || ''; }catch(e){ return ''; }
}
function saveCertBg(dataUrl){
  try{ localStorage.setItem(CERT_BG_KEY, dataUrl); return true; }
  catch(e){ toast('Background image could not be saved (storage limit). Try a smaller PNG.','error'); return false; }
}
function clearCertBg(){ try{ localStorage.removeItem(CERT_BG_KEY); }catch(e){} }
/* Remote certificate design, cached for the session.
   Firestore holds the layout; Storage holds the PNG. The bytes are
   cached in localStorage so a student's certificate still renders
   instantly (and offline) after the admin has published a design. */
let REMOTE_CERT = { design:null, bg:'', loaded:false };

function refreshCertDesignRemote(){
  const svc = FS();
  if(!svc || !svc.state.firestoreReady || !svc.isSignedIn) return Promise.resolve(null);
  return loadCertDesignRemote().then(function(doc){
    if(!doc){ REMOTE_CERT.loaded = true; return null; }
    const design = {
      useCustom: !!doc.useCustom,
      aspect: Number(doc.aspect) || 1.414,
      fields: Array.isArray(doc.fields) ? doc.fields : []
    };
    const bg = doc.backgroundUrl || '';
    REMOTE_CERT = { design: design, bg: bg, loaded: true };
    /* mirror locally so the student view needs no extra round trip */
    if(bg){
      try{ localStorage.setItem(CERT_DESIGN_KEY, JSON.stringify(design)); }catch(e){}
      try{ localStorage.setItem(CERT_BG_KEY, bg); }catch(e){}
    }else{
      try{ localStorage.setItem(CERT_DESIGN_KEY, JSON.stringify(design)); }catch(e){}
    }
    return REMOTE_CERT;
  }).catch(function(){ REMOTE_CERT.loaded = true; return null; });
}

function getActiveCertDesign(){
  /* prefer the design the admin saved on the server */
  if(REMOTE_CERT.loaded && REMOTE_CERT.design && REMOTE_CERT.design.useCustom && REMOTE_CERT.bg){
    return { design: REMOTE_CERT.design, bg: REMOTE_CERT.bg };
  }
  return { design: loadCertDesign(), bg: loadCertBg() };
}

function autoFieldValue(key, sample){
  const s = sample || {};
  switch(key){
    case 'studentName':   return s.studentName   || '';
    case 'kgid':          return s.kgid          || '';
    case 'email':         return s.email         || '';
    case 'trainingTitle': return s.trainingTitle || '';
    case 'trainingTopic': return s.trainingTopic || '';
    case 'trainingDate':  return s.trainingDate  || '';
    case 'marks':         return s.marks         || '';
    case 'totalMarks':    return s.totalMarks    || '';
    case 'percentage':    return s.percentage    || '';
    case 'certNo':        return s.certNo        || '';
    case 'institute':     return s.institute     || '';
    default:              return '';
  }
}
function certFieldStyle(field){
  const fontDef = CERT_FONTS[field.fontFamily] || CERT_FONTS.kn;
  const align = ['left','center','right'].indexOf(field.align) !== -1 ? field.align : 'left';
  const color = /^#[0-9a-fA-F]{3,8}$/.test(field.color || '') ? field.color : '#14243A';
  const fs = Math.max(0.5, Math.min(30, Number(field.fontSize) || 3));
  const w = Math.max(5, Math.min(100, Number(field.w) || 30));
  const x = Math.max(0, Math.min(100, Number(field.x) || 0));
  const y = Math.max(0, Math.min(100, Number(field.y) || 0));
  return 'left:' + x.toFixed(3) + '%;top:' + y.toFixed(3) + '%;width:' + w.toFixed(3) + '%;' +
         'font-size:' + fs.toFixed(3) + 'cqh;' +
         'font-family:' + fontDef.css + ';' +
         'color:' + color + ';' +
         'text-align:' + align + ';' +
         'font-weight:' + (field.bold ? '700' : '500') + ';';
}

function selectCertField(id){
  certDesState.selectedId = id;

  });

function syncCertFieldPanel(field){
  const panel = document.getElementById('certdesProps');
  if(!panel) return;
  ['x','y','w'].forEach(p => {
    const inp = panel.querySelector('[data-cd-prop="' + p + '"]');
    if(inp) inp.value = (Number(field[p]) || 0).toFixed(1);
  });
}
function bindCertDesInputs(){
  $$('[data-cd-prop]').forEach(el => {
    el.addEventListener('input', function(){
      if(!certDesState.selectedId || !certDesState.design) return;
      const field = certDesState.design.fields.find(f => f.id === certDesState.selectedId);
      if(!field) return;
      const prop = el.getAttribute('data-cd-prop');
      let v = el.value;
      if(['x','y','w','fontSize'].indexOf(prop) !== -1) v = Number(v) || 0;
      if(prop === 'bold') v = v === '1';
      field[prop] = v;
      updateEditorField(field);
    });
  });
  const chk = document.getElementById('certUseCustom');
  if(chk && !chk.__cdBound){
    chk.__cdBound = true;
    chk.addEventListener('change', function(){
      if(certDesState.design) certDesState.design.useCustom = chk.checked;
    });
  }
}

/* ---- Persist the designer to Firebase (Phase 9) ---- */
function persistCertDesign(){
  const design = certDesState.design;
  if(!design) return Promise.resolve(false);

  const svc = FS();
  if(!svc || !svc.state.firestoreReady || !authIsAdmin()){
    /* offline / not configured: keep the previous local-only behaviour */
    const okLocal = saveCertDesign(design);
    if(okLocal) toast('Certificate design saved locally.', 'success');
    return Promise.resolve(okLocal);
  }

  const st = svc.state;
  const rawBg = String(certDesState.bg || '');
  const isDataUrl = rawBg.indexOf('data:') === 0;
  /* A URL is fine to store. A base64 image is not: a 5MB upload becomes a
     ~6.7MB data URL, and Firestore rejects documents over 1 MiB — which
     failed silently and left the designer pointing at an image nobody else
     could load. Only ever persist a Storage URL. */
  const hasBgDataUrl = isDataUrl;

  if(isDataUrl && !st.storageReady){
    toast('Certificate background was not saved: Storage is not configured. ' +
          'The image is only on this device. Set up Firebase Storage, then upload again.', 'error');
    return Promise.resolve(false);
  }

  const upload = hasBgDataUrl
    ? fetch(certDesState.bg).then(r => r.blob()).then(function(blob){
        const ext = (blob.type || '').indexOf('jpeg') > -1 ? 'jpg' : 'png';
        return svc.uploadCertificateBg(blob, ext);
      })
    : Promise.resolve(rawBg);

  return upload.then(function(bgUrl){
    /* a download URL is required once there is a background at all */
    if(String(bgUrl || '').indexOf('data:') === 0){
      throw Object.assign(new Error('background-not-uploaded'), { code:'background-not-uploaded' });
    }
    if(bgUrl) certDesState.bg = bgUrl;
    return saveCertDesignRemote(design, bgUrl || '');
  }).then(function(){
    REMOTE_CERT = {
      design: { useCustom: !!design.useCustom, aspect: Number(design.aspect)||1.414, fields: deepCopy(design.fields||[]) },
      bg: certDesState.bg || '',
      loaded: true
    };
    saveCertDesign(design);
    if(certDesState.bg) saveCertBg(certDesState.bg);
    toast('Certificate design saved.', 'success');
    return true;
  }).catch(function(err){
    const code = (err && err.code) || (err && err.message) || '';
    console.warn('[cert] save failed', code);
    let msg = 'Certificate design could not be saved.';
    if(code === 'permission-denied' || code === 'not-admin') msg = 'Only the admin can save the certificate design.';
    else if(code === 'storage/unauthorized') msg = 'Storage permission denied — check storage.rules.';
    else if(code === 'storage/retry-limit-exceeded') msg = 'Upload failed (network). Try a smaller image.';
    else if(code === 'background-not-uploaded'){
      msg = 'Background upload did not complete, so it was NOT saved. The rest of the design is unchanged.';
    }
    toast(msg, 'error');
    return false;
  });
}

function resetCertDesignRemote(){
  certDesState.design = defaultCertDesign();
  certDesState.bg = '';
  certDesState.selectedId = null;
  saveCertDesign(certDesState.design);
  clearCertBg();
  try{ localStorage.removeItem(CERT_BG_KEY); }catch(e){}
  const svc = FS();
  if(!svc || !svc.state.firestoreReady || !authIsAdmin()){
    toast('Reset to default certificate.','success');
    return Promise.resolve(true);
  }
  return saveCertDesignRemote(certDesState.design, '').then(function(){
    REMOTE_CERT = { design: deepCopy(certDesState.design), bg:'', loaded:true };
    toast('Reset to default certificate.','success');
    return true;
  }).catch(function(){
    toast('Reset saved locally only — server update failed.','error');
    return false;
  });
}

/* ---- Student custom certificate renderer ---- */
function renderCustomCertificate(t, sub, certNo, design, bg){
  const sample = {
    studentName:    sub.details.name || sub.userName,
    kgid:           sub.details.kgid || '—',
    email:          sub.details.email || '—',
    trainingTitle:  t.title,
    trainingTopic:  t.topic,
    trainingDate:   t.date,
    marks:          String(sub.result.marks),
    totalMarks:     String(sub.result.total),
    percentage:     sub.result.pct + '%',
    certNo:         certNo,
    institute:      INSTITUTE
  };
  const fieldsHtml = design.fields.map(f => {
    const text = f.type === 'auto' ? autoFieldValue(f.key, sample) : (f.text || '');
    return '<div class="cert-custom-field" style="' + certFieldStyle(f) + '">' + esc(text) + '</div>';
  }).join('');
  const aspect = Number(design.aspect) || 1.414;

/* ============================================================
   SECTION L.2 — ADMIN: STUDENT ACCOUNTS (Phase 5)
   ------------------------------------------------------------
   Reads students/* from Firestore, lets the admin approve,
   reject, re-enable or disable an account.

   Security note: the buttons here are convenience only. Every
   write goes through Firestore rules (firestore.rules), so a
   student cannot approve themselves even with the console open.
   ============================================================ */

const ACCOUNTS = {
  list: [],
  loaded: false,
  loading: false,
  error: '',
  filter: { q: '', status: '' }
};

function loadStudentAccounts(force){
  const svc = FS();
  if(!svc || !svc.state.firestoreReady) return Promise.resolve([]);
  if(!authIsAdmin()) return Promise.resolve([]);
  if(ACCOUNTS.loading) return Promise.resolve(ACCOUNTS.list);
  if(ACCOUNTS.loaded && !force) return Promise.resolve(ACCOUNTS.list);

  ACCOUNTS.loading = true;
  ACCOUNTS.error = '';

  return svc.getDocs(svc.collection('students'))
    .then(function(snap){
      const rows = [];
      if(snap && typeof snap.forEach === 'function'){
        snap.forEach(function(d){
          const v = d.data() || {};
          rows.push(Object.assign({ _id: d.id }, v));
        });
      }
      rows.sort(function(a, b){
        const sa = String(a.status || 'pending'), sb = String(b.status || 'pending');
        if(sa !== sb) return sa === 'pending' ? -1 : (sb === 'pending' ? 1 : sa.localeCompare(sb));
        return String(a.officialName || '').localeCompare(String(b.officialName || ''));
      });
      ACCOUNTS.list = rows;
      ACCOUNTS.loaded = true;
      ACCOUNTS.loading = false;
      return rows;
    })
    .catch(function(err){
      ACCOUNTS.loading = false;
      /* mark as loaded even on failure — otherwise every re-render
         retries and the page loops forever */
      ACCOUNTS.loaded = true;
      ACCOUNTS.error = (err && err.code) === 'permission-denied'
        ? 'ಅನುಮತಿ ನಿರಾಕರಿಸಲಾಗಿದೆ — Firestore ನಿಯಮಗಳಲ್ಲಿ ನಿಮ್ಮ ಇಮೇಲ್ ಇದೆಯೇ ಪರಿಶೀಲಿಸಿ.'
        : 'ವಿದ್ಯಾರ್ಥಿ ಪಟ್ಟಿ ಲೋಡ್ ಆಗಲಿಲ್ಲ.';
      console.warn('[accounts] load failed', err && err.code);
      return [];
    });
}

function refreshStudentAccounts(){
  ACCOUNTS.loaded = false;
  return loadStudentAccounts(true).then(function(){
    render();
  });
}

    disable: ['ಖಾತೆ ನಿಷ್ಕ್ರಿಯಗೊಳಿಸುವುದೇ?', 'ಈ ವಿದ್ಯಾರ್ಥಿಗೆ ಪ್ರವೇಶ ತಕ್ಷಣ ನಿಲ್ಲುತ್ತದೆ.', 'disabled'],

  }[action];
  if(!labels) return;

      console.warn('[accounts] update failed', err && err.code);
    });
  }, action === 'reject' || action === 'disable');
}

/* re-render as the admin types in the account filters */
function bindAccountFilters(){
  $$('[data-acct-filter]').forEach(function(el){
    const handler = function(){
      const key = el.getAttribute('data-acct-filter');
      ACCOUNTS.filter[key] = el.value;
      render();
      /* keep focus + caret in the search box while typing */
      const again = document.querySelector('[data-acct-filter="' + key + '"]');
      if(again && key === 'q'){
        again.focus();
        const v = again.value;
        try{ again.setSelectionRange(v.length, v.length); }catch(e){}
      }
    };
    el.addEventListener('input', handler);
    el.addEventListener('change', handler);
  });
}

/* ============================================================
   SECTION L.3 — ADMIN: DATA BACKUP  (Phase 11)
   ------------------------------------------------------------
   Exports everything the admin can read as a single JSON file, and
   restores from one after validating it.

   Restoration is deliberately conservative:
     - the file is validated before anything is written
     - the admin must confirm, and the summary is shown first
     - students, trainings, submissions, certificates and the
       certificate design are re-written document by document
     - nothing is deleted; Firestore rules still validate every write
   ============================================================ */

const BACKUP_VERSION = 2;

function backupTimestamp(){
  const d = new Date();
  const p = n => String(n).padStart(2,'0');
  return d.getFullYear() + p(d.getMonth()+1) + p(d.getDate()) + '-' + p(d.getHours()) + p(d.getMinutes());
}

/* ---------- export ---------- */

function buildBackupPayload(){
  const svc = FS();
  return Promise.all([
    svc.getDocs(svc.collection('students')),
    svc.getDocs(svc.collection('trainings')),
    svc.getDocs(svc.collection('submissions')),
    svc.getDocs(svc.collection('certificates')),
    svc.getDoc(svc.doc('certificateDesigns/current')),
    svc.getDoc(svc.doc('settings/portal'))
  ]).then(function(res){
    const asArray = function(snap){
      const out = [];
      if(snap && typeof snap.forEach === 'function'){
        snap.forEach(function(d){
          const v = d.data() || {};
          out.push(Object.assign({ _id: d.id }, v));
        });
      }
      return out;
    };
    const designSnap = res[4];
    const settingsSnap = res[5];
    return {
      _format: 'dti-bengaluru-backup',
      _version: BACKUP_VERSION,
      exportedAt: new Date().toISOString(),
      exportedBy: (svc && svc.email) || '',
      institute: (typeof INSTITUTE !== 'undefined' ? INSTITUTE : ''),
      counts: {
        students: asArray(res[0]).length,
        trainings: asArray(res[1]).length,
        submissions: asArray(res[2]).length,
        certificates: asArray(res[3]).length
      },
      students: asArray(res[0]),
      trainings: asArray(res[1]),
      submissions: asArray(res[2]),
      certificates: asArray(res[3]),
      certificateDesign: designSnap && designSnap.exists() ? designSnap.data() : null,
      settings: settingsSnap && settingsSnap.exists() ? settingsSnap.data() : null
    };
  });
}

function downloadBlob(filename, text, type){
  try{
    const blob = new Blob([text], { type: type || 'application/json;charset=utf-8;' });
    const url = URL.createObjectURL(blob);
    const a = document.createElement('a');
    a.href = url;
    a.download = filename;
    document.body.appendChild(a);
    a.click();
    document.body.removeChild(a);
    setTimeout(function(){ URL.revokeObjectURL(url); }, 1500);
    return true;
  }catch(e){
    return false;
  }
}

function exportBackupJSON(){
  if(!firestoreOn()){ toast('ಡೇಟಾಬೇಸ್ ಸಂಪರ್ಕವಿಲ್ಲ.', 'error'); return; }
  toast('ಬ್ಯಾಕಪ್ ಸಿದ್ಧಪಡಿಸಲಾಗುತ್ತಿದೆ…', 'info');
  buildBackupPayload().then(function(payload){
    const name = 'dti-bengaluru-backup-' + backupTimestamp() + '.json';
    if(downloadBlob(name, JSON.stringify(payload, null, 2))){
      toast('ಬ್ಯಾಕಪ್ ಫೈಲ್ ಡೌನ್‌ಲೋಡ್ ಆಗಿದೆ.', 'success');
    }else{
      toast('ಡೌನ್‌ಲೋಡ್ ವಿಫಲವಾಯಿತು.', 'error');
    }
  }).catch(function(err){
    console.warn('[backup] export failed', err && err.code);
    toast('ಬ್ಯಾಕಪ್ ರಫ್ತು ವಿಫಲವಾಯಿತು.', 'error');
  });
}

/* CSV is offered per table because spreadsheet use is the common case */
function exportBackupCSV(which){
  if(!firestoreOn()){ toast('ಡೇಟಾಬೇಸ್ ಸಂಪರ್ಕವಿಲ್ಲ.', 'error'); return; }

  buildBackupPayload().then(function(p){
    let rows = [];
    let header = [];

    if(which === 'students'){
      header = ['ಅಧಿಕೃತ ಹೆಸರು','ಕೆ.ಜಿ.ಐ.ಡಿ','ಇಮೇಲ್','ಹುದ್ದೆ','ಇಲಾಖೆ','ಸ್ಥಿತಿ','uid'];
      rows = p.students.map(function(s){
        return [s.officialName||'', s.kgid||'', s.email||'', s.designation||'', s.department||'', s.status||'', s._id||''];
      });
    }else if(which === 'results'){
      header = ['ವಿದ್ಯಾರ್ಥಿ','ಕೆ.ಜಿ.ಐ.ಡಿ','ತರಬೇತಿ','ಅಂಕಗಳು','ಒಟ್ಟು','ಶೇಕಡಾವಾರು','ಸ್ಥಿತಿ','ಪ್ರಮಾಣಪತ್ರ','ಸಲ್ಲಿಸಿದ ದಿನಾಂಕ'];
      rows = p.submissions.map(function(s){
        return [s.officialNameSnapshot||'', s.kgidSnapshot||'', s.trainingTitle||'',
                s.marksObtained||0, s.totalMarks||0, (s.percentage||0)+'%',
                s.passStatus?'ಉತ್ತೀರ್ಣ':'ಅನುತ್ತೀರ್ಣ', s.certificateNo||'-', s.submittedAt||''];
      });
    }else if(which === 'trainings'){
      header = ['ಶೀರ್ಷಿಕೆ','ವಿಷಯ','ದಿನಾಂಕ','ಉತ್ತೀರ್ಣ %','ಪ್ರಶ್ನೆಗಳು','ಪ್ರಕಟಿತ','ಸಂಗ್ರಹಿತ','id'];
      rows = p.trainings.map(function(t){
        return [t.title||'', t.topic||'', t.date||'', t.passing||70,
                (t.questions||[]).length, t.published?'ಹೌದು':'ಇಲ್ಲ', t.archived?'ಹೌದು':'ಇಲ್ಲ', t._id||''];
      });
    }else if(which === 'certificates'){
      header = ['ಸಂಖ್ಯೆ','ವಿದ್ಯಾರ್ಥಿ','ತರಬೇತಿ','ಅಂಕಗಳು','ಶೇಕಡಾವಾರು','issuedAt'];
      rows = p.certificates.map(function(c){
        return [c.number||'', c.studentName||'', c.trainingTitle||'',
                (c.marks||0)+' / '+(c.total||0), (c.pct||0)+'%', c.issuedAt||''];
      });
    }else{
      toast('ಅಜ್ಞಾತ ರಫ್ತು ಪ್ರಕಾರ.', 'error'); return;
    }

    const csv = '\uFEFF' + [header].concat(rows)
      .map(function(r){ return r.map(function(c){ return '"' + String(c).replace(/"/g,'""') + '"'; }).join(','); })
      .join('\r\n');

    const name = 'dti-' + which + '-' + backupTimestamp() + '.csv';
    if(downloadBlob(name, csv, 'text/csv;charset=utf-8;')){
      toast('CSV ಡೌನ್‌ಲೋಡ್ ಆಗಿದೆ.', 'success');
    }else{
      toast('ಡೌನ್‌ಲೋಡ್ ವಿಫಲವಾಯಿತು.', 'error');
    }
  }).catch(function(){
    toast('CSV ರಫ್ತು ವಿಫಲವಾಯಿತು.', 'error');
  });
}

/* ---------- import ---------- */

function validateBackup(data){
  const errs = [];
  if(!data || typeof data !== 'object') return ['ಫೈಲ್ ಓದಲು ಸಾಧ್ಯವಿಲ್ಲ (JSON ಅಲ್ಲ).'];
  if(data._format !== 'dti-bengaluru-backup') errs.push('ಇದು ಈ ಪೋರ್ಟಲ್‌ನ ಬ್ಯಾಕಪ್ ಫೈಲ್ ಅಲ್ಲ.');
  if(!data._version || data._version > BACKUP_VERSION){
    errs.push('ಬ್ಯಾಕಪ್ ಆವೃತ್ತಿ ಹೊಂದಿಕೆಯಾಗುತ್ತಿಲ್ಲ (ಫೈಲ್: ' + (data._version || '?') + ').');
  }
  ['students','trainings','submissions','certificates'].forEach(function(k){
    if(data[k] !== undefined && !Array.isArray(data[k])) errs.push(k + ' ಸರಿಯಾದ ಪಟ್ಟಿಯಲ್ಲ.');
  });
  if(!Array.isArray(data.trainings) || data.trainings.length === 0){
    errs.push('ಬ್ಯಾಕಪ್‌ನಲ್ಲಿ ಯಾವುದೇ ತರಬೇತಿಗಳಿಲ್ಲ — ಇದು ತಪ್ಪಾದ ಫೈಲ್ ಇರಬಹುದು.');
  }
  (data.students || []).forEach(function(s, i){
    if(!s._id) errs.push('ವಿದ್ಯಾರ್ಥಿ #' + (i+1) + ': id ಇಲ್ಲ.');
    if(!s.officialName) errs.push('ವಿದ್ಯಾರ್ಥಿ #' + (i+1) + ': ಅಧಿಕೃತ ಹೆಸರು ಇಲ್ಲ.');
  });
  (data.trainings || []).forEach(function(t, i){
    if(!t._id) errs.push('ತರಬೇತಿ #' + (i+1) + ': id ಇಲ್ಲ.');
    if(!t.title) errs.push('ತರಬೇತಿ #' + (i+1) + ': ಶೀರ್ಷಿಕೆ ಇಲ್ಲ.');
  });
  return errs;
}

function summarizeBackup(data){
  return {
    students: (data.students || []).length,
    trainings: (data.trainings || []).length,
    submissions: (data.submissions || []).length,
    certificates: (data.certificates || []).length,
    design: data.certificateDesign ? 'ಹೌದು' : 'ಇಲ್ಲ',
    exportedAt: data.exportedAt || '—',
    exportedBy: data.exportedBy || '—'
  };
}

function restoreBackup(data){
  const svc = FS();
  if(!firestoreOn() || !authIsAdmin()) return Promise.reject(new Error('not-admin'));

  const jobs = [];
  const put = function(path, doc){
    const clean = Object.assign({}, doc);
    delete clean._id;
    jobs.push({ path: path, doc: clean });
  };

  (data.students || []).forEach(function(s){ put('students/' + s._id, s); });
  (data.trainings || []).forEach(function(t){ put('trainings/' + t._id, t); });
  (data.submissions || []).forEach(function(s){ put('submissions/' + s._id, s); });
  (data.certificates || []).forEach(function(c){ put('certificates/' + c._id, c); });
  if(data.certificateDesign) put('certificateDesigns/current', data.certificateDesign);
  if(data.settings) put('settings/portal', data.settings);

  /* sequential writes: keeps us well under connection limits and makes
     a partial failure easy to reason about */
  let done = 0;
  const step = function(i){
    if(i >= jobs.length) return Promise.resolve(done);
    const j = jobs[i];
    return svc.setDoc(svc.doc(j.path), j.doc, { merge: true })
      .then(function(){ done++; return step(i+1); })
      .catch(function(err){
        console.warn('[backup] restore skipped', j.path, err && err.code);
        return step(i+1);
      });
  };
  return step(0);
}

function handleBackupFile(file){
  if(!file){ return; }
  if(file.size > 20 * 1024 * 1024){
    toast('ಫೈಲ್ ತುಂಬಾ ದೊಡ್ಡದಾಗಿದೆ (ಗರಿಷ್ಠ 20MB).', 'error');
    return;
  }
  const reader = new FileReader();
  reader.onload = function(e){
    let data;
    try{ data = JSON.parse(e.target.result); }
    catch(err){ toast('ಫೈಲ್ ಸರಿಯಾದ JSON ಅಲ್ಲ.', 'error'); return; }

    const errs = validateBackup(data);
    if(errs.length){
      openModal(
        '<h3>ಬ್ಯಾಕಪ್ ಮಾನ್ಯವಾಗಿಲ್ಲ</h3>' +
        '<div class="form-msg show error" style="margin-bottom:14px;">ಈ ಫೈಲ್ ಅನ್ನು ಆಮದು ಮಾಡಲು ಸಾಧ್ಯವಿಲ್ಲ.</div>' +
        '<ul class="small" style="line-height:1.9;">' + errs.slice(0,12).map(function(x){ return '<li>' + esc(x) + '</li>'; }).join('') + '</ul>' +
        '<div class="modal-actions"><button class="btn btn-ghost" data-action="modal-close">ಮುಚ್ಚಿ</button></div>'
      );
      return;
    }

    const s = summarizeBackup(data);
    openModal(
      '<h3>ಬ್ಯಾಕಪ್ ಮರುಸ್ಥಾಪಿಸುವುದೇ?</h3>' +
      '<p class="muted small">ಈ ಫೈಲ್‌ನಿಂದ ಡೇಟಾವನ್ನು ಬರೆಯಲಾಗುತ್ತದೆ. ಇರುವ ದಾಖಲೆಗಳು ಅಳಿಸುವುದಿಲ್ಲ — ಅದೇ ID ಗಳಿದ್ದರೆ ನವೀಕರಿಸಲಾಗುತ್ತದೆ.</p>' +

        '<div><b>ರಫ್ತು ಮಾಡಿದವರು:</b> ' + esc(s.exportedBy) + '</div>' +
        '<div><b>ವಿದ್ಯಾರ್ಥಿಗಳು:</b> ' + s.students + '</div>' +

        '<div><b>ಸರ್ಟಿಫಿಕೇಟ್ ವಿನ್ಯಾಸ:</b> ' + esc(s.design) + '</div>' +
      '</div>' +
      '<div class="form-msg show error" style="margin-bottom:0;">ಎಲ್ಲಾ ದಾಖಲೆಗಳು ನಿಮ್ಮ ಖಾತೆಯಿಂದ ಮತ್ತೆ ಬರೆಯಲ್ಪಡುತ್ತವೆ. ಮುಂದುವರಿಯುವ ಮೊದಲು ಪ್ರಸ್ತುತ ಡೇಟಾದ ಬ್ಯಾಕಪ್ ತೆಗೆದುಕೊಳ್ಳಿ.</div>' +

  };
